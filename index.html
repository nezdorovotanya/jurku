<style id="app-css">
/* Layout: quiet Scandinavian showroom — white ground, hairlines, outlined buttons, full-bleed muted colour tiles; configurator = big 3D stage left, options right */
:root{
  --bg:#FFFFFF; --ink:#141414; --muted:#6F6E6A; --hair:#E4E3DF; --tile:#CBC9C4; --tile2:#EEEDE9;
  --sage:#D3DAC4; --sky:#AEC3D7; --clay:#B8583F; --oak:#D2B387; --birch:#E3CDA7; --edge:#BE9663; --warn:#A3361F;
  --f:"Inter","Helvetica Neue",Arial,sans-serif;
  --gut:max(clamp(16px,2.4vw,34px),env(safe-area-inset-left,0px));
  --gutR:max(clamp(16px,2.4vw,34px),env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
section[id]{scroll-margin-top:calc(90px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
.pad{padding-left:var(--gut);padding-right:var(--gutR)}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.btn{display:inline-block;appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 22px;font-size:15px;line-height:1.3;cursor:pointer;text-decoration:none;border-radius:0;white-space:nowrap}
.btn:hover,.btn.on{background:var(--ink);color:var(--bg)}
.btn.sm{padding:6px 14px;font-size:13px}

/* header */
.ob-open{display:flex;gap:6px;align-items:center;flex:1 1 280px;max-width:520px}.ob-open input{flex:1;min-width:0;background:#2A2A2A;border:1px solid #444;color:#F2F1EC;padding:5px 8px;font:inherit}.ob-open button{background:#F2F1EC;color:#1B1B1B;border:0;padding:5px 12px;font:inherit;cursor:pointer}.ob-open span{color:#E8A08A}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--hair)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:80px;gap:20px}
.brand{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;line-height:0}
.brand .logo{display:block;height:22px;width:auto;fill:currentColor;transform:translateY(2px)}
.nav{display:flex;gap:clamp(20px,3vw,46px)}
.nav a{position:relative;color:var(--ink);text-decoration:none;font-size:15px;padding-block:28px}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--ink)}
.nav a.owner{color:var(--muted)}
.top-btns{justify-self:end;display:flex;gap:16px}

/* intro + tiles */
.statement{padding-block:clamp(48px,7vw,96px)}
.statement h1{font-size:clamp(20px,1.9vw,26px);line-height:1.35;max-width:46ch;margin-left:clamp(0px,7vw,104px)}
.statement p{margin:14px 0 0 clamp(0px,7vw,104px);color:var(--muted);max-width:60ch}
.tiles{display:grid;grid-template-columns:1fr 1fr}
.tile.wide{grid-column:1/-1;aspect-ratio:2.6/1}
.tile{position:relative;display:block;aspect-ratio:2/1.08;overflow:hidden;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.tile-h{position:absolute;inset:34px var(--gutR) auto var(--gut);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;z-index:2}
.tile-h h2{font-size:clamp(20px,1.8vw,26px)}
.tile .btn{background:transparent}
.tile:hover .btn{background:var(--ink);color:var(--bg)}
.tile svg.ill{position:absolute;inset:0;width:100%;height:100%}

/* configurator */
.config{padding-block:clamp(56px,7vw,96px) 24px}
.config-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.config-h h2{font-size:clamp(26px,3vw,42px);line-height:1.1}
.config-h .eyebrow{margin:0 0 10px;font-size:13px;color:var(--muted)}
.cfg-sub{margin:12px 0 0;color:var(--muted);max-width:62ch}
.config{border-top:1px solid var(--hair)}
.studio{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
.stage{position:sticky;top:calc(96px + env(safe-area-inset-top,0px));display:grid;gap:0;min-width:0}
.stage.tall{position:static}
.view{position:relative;background:var(--tile2);aspect-ratio:4/3;max-width:100%;overflow:hidden}
.view-h{position:absolute;top:18px;left:20px;right:20px;display:flex;flex-wrap:wrap-reverse;justify-content:space-between;align-items:flex-start;gap:8px 12px;z-index:3;pointer-events:none}
.view-t{min-width:0;flex:1 1 180px}
.view-t small{white-space:nowrap}
.view-h>*{pointer-events:auto}
.view-t{font-size:17px}
.view-t small{display:block;color:var(--muted);font-size:13px}
.vtog{display:flex}
.vtog .btn{background:rgba(255,255,255,.7)}
.vtog .btn.on{background:var(--ink);color:var(--bg)}
.vtog .btn+.btn{margin-left:-1px}
.vtog #cutBtn{margin-right:8px}
#canvasWrap,#svgWrap{position:absolute;inset:0}
#canvasWrap canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
#svgWrap{display:flex;align-items:center;justify-content:center;padding:78px 22px 40px}
#svgWrap svg{width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#svgWrap svg.drag{cursor:grabbing}
.zoombar{position:absolute;right:20px;top:72px;display:flex;flex-direction:column;z-index:3}
#svgWrap{padding-right:72px}
@media (max-width:640px){#svgWrap{padding:96px 12px 56px}.zoombar{top:auto;bottom:10px;left:12px;right:auto;flex-direction:row}.zoombar .btn{width:34px;height:34px}.zoombar .btn+.btn{margin:0 0 0 -1px}}
.zoombar .btn{width:36px;height:36px;padding:0;background:rgba(255,255,255,.75);font-size:17px;line-height:1}
.zoombar .btn+.btn{margin-top:-1px}
#svgWrap *{vector-effect:non-scaling-stroke}
.view-hint{position:absolute;left:20px;bottom:14px;font-size:12px;color:var(--muted);z-index:3;max-width:40%;line-height:1.3}
.legend{position:absolute;right:20px;bottom:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 14px;font-size:12px;color:var(--muted);z-index:3;max-width:56%}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:11px;height:11px;border:1px solid rgba(0,0,0,.25)}
.price{padding-top:24px;display:grid;gap:14px}
.price-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.total-l{font-size:13px;color:var(--muted)}
.total{font-size:clamp(28px,2.8vw,38px);line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.range{font-size:13px;color:var(--muted)}
.time{font-size:13px;color:var(--muted);text-align:right}
.time.bad{color:var(--warn)}
details{border-top:1px solid var(--hair);padding-top:12px}
summary{cursor:pointer;font-size:14px}
.lines{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;font-size:13px}
.lines li{display:flex;justify-content:space-between;gap:16px}
.lines li span:first-child{min-width:0;color:var(--muted)}
.lines li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.lines li.sum{border-top:1px solid var(--ink);padding-top:8px}
.lines li.sum span{color:var(--ink)!important}
.disclaimer{margin:0;font-size:12px;color:var(--muted)}
.price.stale .total,.price.stale .lines,.price.stale .range{opacity:.45;transition:opacity .2s}
.warns{display:grid;gap:6px}
.warns p{margin:0;font-size:13px;color:var(--warn)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}

.controls{display:grid;min-width:0}
.ctrl-head{display:grid;gap:8px;padding-bottom:22px}
.ctrl-head h3{font-size:24px;line-height:1.2}
.ctrl-head p{margin:0;color:var(--muted);max-width:56ch}
.grp{font-size:13px;color:var(--muted);padding-top:30px;padding-bottom:4px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.field{display:grid;gap:12px;padding-block:18px;border-top:1px solid var(--hair)}
.flabel{font-size:14px;padding:0}
/* legend сидит на верхней линии fieldset; float выводит его из рамки, и линия идёт над подписью, как у остальных полей */
legend.flabel{float:left;width:100%;margin:0}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.fval{font-size:14px;font-variant-numeric:tabular-nums}
.fnote{margin:0;font-size:13px;color:var(--muted);max-width:62ch}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;padding:8px 14px;border:1px solid var(--hair);font-size:14px;background:var(--bg)}
.opt:hover span{border-color:var(--ink)}
.opt input:checked + span{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt input:focus-visible + span{outline:1px solid var(--ink);outline-offset:3px}
.swatches{display:flex;flex-wrap:wrap;gap:16px}
.swt{position:relative;display:grid;gap:7px;justify-items:center;cursor:pointer;font-size:12px;color:var(--muted);width:64px;text-align:center}
.swt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip{width:42px;height:42px;border:1px solid rgba(0,0,0,.12)}
.swt input:checked ~ .chip{outline:1px solid var(--ink);outline-offset:3px}
.swt input:checked ~ .swl{color:var(--ink)}
.swt input:focus-visible ~ .chip{outline:2px solid var(--ink);outline-offset:3px}
input[type=range]{width:100%;accent-color:var(--ink);margin:0}
.fscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.numwrap{display:flex;align-items:center;gap:10px}
.numwrap input{width:150px;max-width:100%;padding:8px 10px;border:1px solid var(--hair);border-radius:0;background:var(--bg);font-variant-numeric:tabular-nums}
.numwrap input:focus{border-color:var(--ink);outline:none}
.numwrap span{font-size:13px;color:var(--muted)}
.checks{display:grid}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--hair);cursor:pointer;font-size:14px}
.chk:first-child{border-top:0}
.chk input{accent-color:var(--ink);width:16px;height:16px;margin:2px 0 0}
.chk small{display:block;color:var(--muted);font-size:12px}
.chk-p{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hint{display:grid;gap:10px;padding:20px;background:var(--sage);margin-top:18px}
.hint p{margin:0;font-size:14px}
.hint .btn{justify-self:start}

/* economics bars */
.bars{position:absolute;inset:0;padding:84px 24px 48px;display:grid;align-content:center;gap:22px}
.bar-h{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bar{display:flex;height:22px;margin-top:8px;background:var(--bg)}
.bar i{display:block;height:100%}
.b-mat{background:var(--oak)} .b-lab{background:var(--sky)} .b-mar{background:var(--clay)} .b-fix{background:var(--tile)} .b-tax{background:#8C8A84}
.bars{overflow:auto;align-content:start}
.view.is-model{aspect-ratio:auto}
.view.is-model .bars{position:relative;inset:auto;padding:84px 24px 28px}
.bars>div{min-width:0}
.eco-t{overflow-x:auto}
@media (max-width:560px){.view.is-model .bars{padding:76px 16px 20px}.eco-leg li{grid-template-columns:12px 1fr auto 36px;gap:8px}}
.eco-h{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.bar.tall{height:34px;margin-top:10px}
.eco-leg{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.eco-leg li{display:grid;grid-template-columns:14px 1fr auto 44px;gap:10px;align-items:center}
.eco-leg .sw{width:12px;height:12px;border:0}
.eco-leg b{font-weight:500} .eco-leg em{font-style:normal;color:var(--muted);text-align:right}
.eco-t table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.eco-t th,.eco-t td{padding:7px 6px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
.eco-t thead th{font-weight:400;color:var(--muted);font-size:12px}
.eco-t th[scope=row]{text-align:left;font-weight:500}
.eco-t td.neg{color:var(--warn)}
.eco-n{font-size:12px;color:var(--muted);margin:8px 0 0}
.tech{display:flex;gap:16px;align-items:center;justify-content:space-between;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:14px 0;margin-top:18px}
.tech b{display:block;font-weight:500;font-size:15px}.tech span{display:block;font-size:12px;color:var(--muted);margin-top:3px;max-width:46ch}
.techview{position:fixed;inset:0;z-index:100;background:#E9E8E4;overflow:auto}
.tv-bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px var(--gut);background:var(--bg);border-bottom:1px solid var(--hair);font-size:14px}
.tv-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tv-note{font-size:12px;color:#6B6A66;margin-right:6px}
.tv-sheets{padding:20px var(--gut);display:grid;gap:20px;justify-items:center}
.tv-sheets svg.sheet{width:min(100%,1400px);height:auto;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
body.tv-open{overflow:hidden}
@media print{body.tv-open>*:not(#techView){display:none!important}body.tv-open #techView{position:static;overflow:visible;background:#fff}.tv-bar{display:none}.tv-sheets{padding:0;gap:0}.tv-sheets svg.sheet{width:420mm;height:297mm;box-shadow:none;break-after:page}@page{size:A3 landscape;margin:0}}
#structBox{margin-top:18px}
.st{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.st th,.st td{padding:9px 6px 9px 0;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
.st thead th{font-weight:400;color:var(--muted);font-size:12px}
.st th[scope=row]{font-weight:500}
.st small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.st td.num{white-space:nowrap;text-align:right;width:92px}
.st-u{display:block;height:4px;background:var(--tile2);margin:6px 0 4px}
.st-u i{display:block;height:100%;background:var(--sage)}
.st tr.bad .st-u i{background:var(--warn)} .st tr.bad td.num{color:var(--warn)}
.st-n{font-size:12px;color:var(--muted);margin:8px 0 0}
@media (max-width:560px){.eco-t th:nth-child(3),.eco-t td:nth-child(3){display:none}}
.bar-s{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* steps */
.steps{padding-block:clamp(64px,8vw,110px) 10px;display:grid;gap:26px}
.steps h2,.request h2{font-size:clamp(24px,2.4vw,34px)}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--hair)}
.steps li{display:grid;gap:6px;align-content:start;padding:18px 18px 18px 0;min-width:0}
.steps li+li{padding-left:18px;border-left:1px solid var(--hair)}
.steps .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.steps p{margin:0;font-size:13px;color:var(--muted)}

/* request */
.request{padding-block:clamp(64px,8vw,110px) 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
.intro-r{display:grid;gap:16px}
.intro-r p{margin:0;color:var(--muted);max-width:52ch}
.contacts{display:grid;gap:4px;font-size:15px}
.contacts span span{user-select:all}
form{display:grid;gap:16px}
.in{display:grid;gap:6px}
.in label,.in .lb{font-size:13px;color:var(--muted)}
.in input,.in textarea{background:var(--bg);border:1px solid var(--hair);border-radius:0;padding:11px 12px;width:100%}
.in input:focus,.in textarea:focus{border-color:var(--ink);outline:none}
.in textarea{resize:vertical;min-height:84px}
.err{margin:0;font-size:13px;color:var(--warn)}

.mbar{display:none}
@media (max-width:1000px){
  .top-in{grid-template-columns:1fr auto;min-height:64px;padding-top:12px}
  .nav{grid-column:1/-1;grid-row:2;overflow-x:auto}
  .nav a{padding-block:12px 14px}

@media (max-width:900px){
  .tiles,.studio,.request{grid-template-columns:minmax(0,1fr)}

  .steps ol{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps li,.steps li+li{padding:16px 16px 16px 0;border-left:0;border-bottom:1px solid var(--hair)}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-top:1px solid var(--hair);
