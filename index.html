<style id="app-css">
/* Layout: quiet Scandinavian showroom — white ground, hairlines, outlined buttons, full-bleed muted colour tiles; configurator = big 3D stage left, options right */
:root{
  --bg:#FFFFFF; --ink:#141414; --muted:#6F6E6A; --hair:#E4E3DF; --tile:#CBC9C4; --tile2:#EEEDE9;
  /* кнопки как «стеклянные» таблетки: светлая дорожка, выбранный пункт — серая капсула с белым ободком, тонкой линией по краю, мягкой тенью и лёгким цветным бликом сверху */
  --btn:#F3F3F2; --r1:999px;
  --track:0 0 0 1px rgba(0,0,0,.035), inset 0 1px 0 rgba(255,255,255,.9), 0 10px 24px -12px rgba(0,0,0,.22);
  --pill-bg:#E2E2E1;
  --pill:none;
    --sage:#D3DAC4; --sky:#AEC3D7; --clay:#B8583F; --oak:#D2B387; --birch:#E3CDA7; --edge:#BE9663; --warn:#A3361F;
  --f:"Inter","Helvetica Neue",Arial,sans-serif;
  --gut:max(clamp(16px,2.4vw,34px),env(safe-area-inset-left,0px));
  --gutR:max(clamp(16px,2.4vw,34px),env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
section[id]{scroll-margin-top:calc(90px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
.pad{padding-left:var(--gut);padding-right:var(--gutR)}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.btn{display:inline-block;appearance:none;border:0;background:var(--btn);color:var(--ink);padding:11px 24px;font-size:15px;line-height:1.3;cursor:pointer;text-decoration:none;border-radius:999px;white-space:nowrap;transition:background .2s ease}
.btn:hover{background:#EDEDEC}
.btn.on,.btn[aria-pressed="true"],.btn:active{background:var(--pill-bg)}
.btn.on,.btn[aria-pressed="true"]{font-weight:500}
.btn:focus-visible,.opt input:focus-visible + span{outline:2px solid var(--ink);outline-offset:3px}
/* главное действие — тёмная капсула с тонким светлым ободком */
.btn.primary{background:#1B1A18;color:#fff}
.btn.primary:hover{background:#2E2D2A}
.btn.primary:active{background:#0C0B09}
.btn.sm{padding:7px 16px;font-size:13px}

/* header */
.ob-open{display:flex;gap:6px;align-items:center;flex:1 1 280px;max-width:520px}.ob-open input{flex:1;min-width:0;background:#2A2A2A;border:1px solid #444;color:#F2F1EC;padding:5px 8px;font:inherit}.ob-open button{background:#F2F1EC;color:#1B1B1B;border:0;padding:5px 12px;font:inherit;cursor:pointer}.ob-open span{color:#E8A08A}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--hair)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:80px;gap:20px}
.brand{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;line-height:0}
.brand .logo{display:block;height:22px;width:auto;fill:currentColor;transform:translateY(2px)}
.nav{display:flex;gap:clamp(20px,3vw,46px)}
.nav a{position:relative;color:var(--ink);text-decoration:none;font-size:15px;padding-block:28px}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--ink)}
.nav a.owner{color:var(--muted)}
.top-btns{justify-self:end;display:flex;gap:16px}
.top-btns .btn,.top-btns .btn:hover,.top-btns .btn:active{background:transparent;box-shadow:none;transform:none;padding-right:0;padding-left:0}
.top-btns .btn:hover{text-decoration:underline;text-underline-offset:4px}

/* intro + tiles */
.statement{padding-block:clamp(48px,7vw,96px)}
.statement h1{font-size:clamp(20px,1.9vw,26px);line-height:1.35;max-width:46ch;margin-left:clamp(0px,7vw,104px)}
.statement p{margin:14px 0 0 clamp(0px,7vw,104px);color:var(--muted);max-width:60ch}
.tiles{display:grid;grid-template-columns:1fr 1fr}
.tile.wide{grid-column:1/-1;aspect-ratio:2.6/1}
/* страница «Материалы»: крупный кадр и короткий рассказ, ряды чередуются */
.mat{padding-block:clamp(40px,6vw,88px)}
.mat .eyebrow{margin:0;font-size:13px;letter-spacing:.02em;color:var(--muted)}
.mat-h{max-width:60ch;margin:0 0 clamp(40px,6vw,80px)}
.mat-h h1{font-size:clamp(34px,4.4vw,60px);line-height:1.05;margin:8px 0 16px}
.mat-h>p:not(.eyebrow){color:var(--muted);font-size:17px;line-height:1.5;margin:0}
.mat-nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:24px;font-size:15px}
.mat-nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:2px}.mat-nav a:hover{border-color:var(--ink)}
.mat-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:center;margin-bottom:clamp(56px,8vw,120px);scroll-margin-top:100px}
.mat-row.flip figure{order:2}
.mat-row figure{margin:0;overflow:hidden;background:#E4E1DB;aspect-ratio:1/1}
.mat-img{display:block;width:100%;height:100%;object-fit:cover}
.mat-t{max-width:52ch}
.mat-t h2{font-size:clamp(26px,2.6vw,38px);line-height:1.1;margin:6px 0 18px}
.mat-t p:not(.eyebrow){font-size:16px;line-height:1.6;margin:0 0 12px;color:#2E2D2A}
.mat-f{margin:22px 0 0;display:grid;gap:0;border-top:1px solid var(--hair)}
.mat-f div{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:14px}
.mat-f dt{color:var(--muted)}.mat-f dd{margin:0}
.mat-end{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-top:8px}
@media (max-width:820px){.mat-row{grid-template-columns:1fr;gap:20px}.mat-row.flip figure{order:0}.mat-f div{grid-template-columns:1fr 1fr}}

body.home .nav a[data-tab="kitchen"],body.home .nav a[data-tab="house"]{display:none}
.tile{position:relative;display:block;aspect-ratio:auto;height:calc(100svh - var(--topH,80px));min-height:460px;max-height:1080px;overflow:hidden;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.tile-h{position:absolute;inset:34px var(--gutR) auto var(--gut);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;z-index:2}
.tile-h h2{font-size:clamp(22px,2.1vw,32px);line-height:1.15}
.tile svg.ill{position:absolute;inset:0;width:100%;height:100%}
.tile img.ill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;transform:scale(1.16);transform-origin:78% 58%;transition:transform .6s ease}
.tile.photo:hover img.ill{transform:scale(1.19)}
/* как у Reform: две плитки во весь экран, кадр крупный — кухня у духовки и вытяжки, дом — торец с окнами в пол */
.tile img.ill.kit{object-position:0% 55%;transform:none}
.tile.photo:hover img.ill.kit{transform:scale(1.03)}
/* дом в тот же рост, что кухня: конёк на уровне верха фартука, цоколь на линии пола кухни */
.tile img.ill.house{object-position:94% 50%;transform:scale(1.284);transform-origin:84% 44.66%}
.tile.photo:hover img.ill.house{transform:scale(1.284)}
.tile-sub{margin:6px 0 0;font-size:15px;color:var(--ink);opacity:.8}

/* configurator */
.config{padding-block:clamp(56px,7vw,96px) 24px}
.config-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.config-h h2{font-size:clamp(26px,3vw,42px);line-height:1.1}
.config-h .eyebrow{margin:0 0 10px;font-size:13px;color:var(--muted)}
.cfg-sub{margin:12px 0 0;color:var(--muted);max-width:62ch}
.config{border-top:1px solid var(--hair)}
.studio{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
/* вид всегда на экране: пока листаешь настройки, он стоит на месте; под ним итог и кнопки */
.stage{position:sticky;top:calc(var(--topH,96px) + 12px);display:flex;flex-direction:column;gap:0;min-width:0;max-height:calc(100vh - var(--topH,96px) - 24px)}
.stage .view{flex:none;max-height:calc(100vh - var(--topH,96px) - 190px);min-height:260px}
.stage .price{flex:none;overflow:visible}
/* состав цены — под конструктором, во всю длину, без прокрутки внутри */
.price-more{max-width:820px;padding-top:clamp(28px,4vw,48px)}
.view{position:relative;background:var(--tile2);aspect-ratio:4/3;max-width:100%;overflow:hidden}
.view-h{position:absolute;top:18px;left:20px;right:20px;display:flex;flex-wrap:wrap-reverse;justify-content:space-between;align-items:flex-start;gap:8px 12px;z-index:3;pointer-events:none}
.view-t{min-width:0;flex:1 1 180px}
.view-t small{white-space:nowrap}
.view-h>*{pointer-events:auto}
.view-t{font-size:17px}
.view-t small{display:block;color:var(--muted);font-size:13px}
.vtog{display:flex}
.vtog{gap:4px}
.vtog .btn{background:rgba(246,246,245,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.vtog #cutBtn,.vtog #openBtn{margin-right:8px}
.fnote .kphoto{display:block;width:100%;max-width:320px;height:auto;margin-top:10px;border-radius:2px}
#canvasWrap,#svgWrap{position:absolute;inset:0}
#canvasWrap canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
#svgWrap{display:flex;align-items:center;justify-content:center;padding:78px 22px 40px}
#svgWrap svg{width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#svgWrap svg.drag{cursor:grabbing}
.zoombar{position:absolute;right:20px;top:72px;display:flex;flex-direction:column;z-index:3}
#svgWrap{padding-right:72px}
@media (max-width:640px){#svgWrap{padding:96px 12px 56px}.zoombar{top:auto;bottom:10px;left:12px;right:auto;flex-direction:row}.zoombar .btn{width:34px;height:34px}.zoombar .btn+.btn{margin:0 0 0 4px}}
.zoombar .btn{width:36px;height:36px;padding:0;background:rgba(246,246,245,.88);font-size:17px;line-height:1}
.zoombar .btn+.btn{margin-top:4px}
#svgWrap *{vector-effect:non-scaling-stroke}
.view-hint{position:absolute;left:20px;bottom:14px;font-size:12px;color:var(--muted);z-index:3;max-width:40%;line-height:1.3}
.legend{position:absolute;right:20px;bottom:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 14px;font-size:12px;color:var(--muted);z-index:3;max-width:56%}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:11px;height:11px;border:1px solid rgba(0,0,0,.25)}
.price{padding-top:24px;display:grid;gap:14px}
.price-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.total-l{font-size:13px;color:var(--muted)}
.total{font-size:clamp(28px,2.8vw,38px);line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.range{font-size:13px;color:var(--muted)}
.time{font-size:13px;color:var(--muted);text-align:right}
.time.bad{color:var(--warn)}
details{border-top:1px solid var(--hair);padding-top:12px}
summary{cursor:pointer;font-size:14px}
.lines{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;font-size:13px}
.lines li{display:flex;justify-content:space-between;gap:16px}
.lines li span:first-child{min-width:0;color:var(--muted)}
.lines li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.lines li.sum{border-top:1px solid var(--ink);padding-top:8px}
.lines li.sum span{color:var(--ink)!important}
.disclaimer{margin:0;font-size:12px;color:var(--muted)}
.price.stale .total,.price.stale .lines,.price.stale .range{opacity:.45;transition:opacity .2s}
.warns{display:grid;gap:6px}
.warns p{margin:0;font-size:13px;color:var(--warn)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.share-msg{font-size:13px;color:var(--muted)}

.controls{display:grid;min-width:0}
.ctrl-head{display:grid;gap:8px;padding-bottom:22px}
.ctrl-head h3{font-size:24px;line-height:1.2}
.ctrl-head p{margin:0;color:var(--muted);max-width:56ch}
.grp{font-size:13px;color:var(--muted);padding-top:30px;padding-bottom:4px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.field{display:grid;gap:12px;padding-block:18px;border-top:1px solid var(--hair)}
.flabel{font-size:14px;padding:0}
/* legend сидит на верхней линии fieldset; float выводит его из рамки, и линия идёт над подписью, как у остальных полей */
legend.flabel{float:left;width:100%;margin:0}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.fval{font-size:14px;font-variant-numeric:tabular-nums}
.fnote{margin:0;font-size:13px;color:var(--muted);max-width:62ch}
.seg{display:flex;width:fit-content;flex-wrap:wrap;gap:2px;padding:5px;background:var(--btn);border-radius:26px;box-shadow:var(--track);max-width:100%}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;padding:9px 18px;border-radius:999px;font-size:14px;color:#3A3936;transition:background .2s ease,box-shadow .2s ease,color .2s ease}
.opt:hover span{color:var(--ink);background:rgba(0,0,0,.035)}
.opt input:checked + span,.opt:hover input:checked + span{color:var(--ink);background:var(--pill-bg)}
.opt input:focus-visible + span{outline:2px solid var(--ink);outline-offset:3px}
.swatches{display:flex;flex-wrap:wrap;gap:16px}
.swt{position:relative;display:grid;gap:7px;justify-items:center;cursor:pointer;font-size:12px;color:var(--muted);width:64px;text-align:center}
.swt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
/* образец: аккуратный квадрат; выбранный — в белом ободке с тонкой линией, без тени */
.chip{width:42px;height:42px;border:0;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:box-shadow .2s ease}
.swt:hover .chip{box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.swt input:checked ~ .chip,.swt:hover input:checked ~ .chip{box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 0 0 3px #fff,0 0 0 4px rgba(0,0,0,.28)}
.swt input:checked ~ .swl{color:var(--ink)}
.swt input:focus-visible ~ .chip{outline:2px solid var(--ink);outline-offset:3px}
input[type=range]{width:100%;accent-color:var(--ink);margin:0}
.fscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.numwrap{display:flex;align-items:center;gap:10px}
.numwrap input{width:150px;max-width:100%;padding:8px 10px;border:1px solid var(--hair);border-radius:0;background:var(--bg);font-variant-numeric:tabular-nums}
.numwrap input:focus{border-color:var(--ink);outline:none}
.numwrap span{font-size:13px;color:var(--muted)}
.checks{display:grid}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--hair);cursor:pointer;font-size:14px}
.chk:first-child{border-top:0}
.chk input{accent-color:var(--ink);width:16px;height:16px;margin:2px 0 0}
.chk small{display:block;color:var(--muted);font-size:12px}
.chk-p{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hint{display:grid;gap:10px;padding:20px;background:var(--sage);margin-top:18px}
.hint p{margin:0;font-size:14px}
.hint .btn{justify-self:start}

/* economics bars */
.bars{position:absolute;inset:0;padding:84px 24px 48px;display:grid;align-content:center;gap:22px}
.bar-h{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bar{display:flex;height:22px;margin-top:8px;background:var(--bg)}
.bar i{display:block;height:100%}

  <section class="statement pad" data-page="home">
    <h1>Кухни и одноэтажные каркасные дома из берёзовой фанеры, дома с мебелью для каждой комнаты. Делаем в своей мастерской в Петербурге, строим по Ленобласти.</h1>
    <p>Всё собирается из модулей, поэтому подстраиваемся под любое пространство: от кухни в студии до дома 30 × 30 м вокруг внутреннего двора.</p>
  </section>

  <section class="mat pad" id="materials" data-page="materials" hidden>
    <div class="mat-h"><p class="eyebrow">Материалы</p><h1>С чем мы работаем</h1><p>Берёзовая фанера, массив дуба, натуральный линолеум и масло. Всё, что вы видите в конструкторе, мы делаем в своей мастерской в Петербурге.</p>
      <nav class="mat-nav" aria-label="Материалы"><a href="#materials" data-mat="ply">Берёзовая фанера</a><a href="#materials" data-mat="lino">Мебельный линолеум</a><a href="#materials" data-mat="paint">Краски</a><a href="#materials" data-mat="oil">Льняное масло с воском</a><a href="#materials" data-mat="korushka">Ручка «Корюшка»</a><a href="#materials" data-mat="drawers">Ящики и органайзеры</a></nav></div>
    <article class="mat-row" id="mat-ply">
      <figure><img class="mat-img ply" alt="Срез берёзовой фанеры 15 мм крупным планом: слои шпона и светлая берёзовая поверхность" loading="lazy" src="assets/mat-ply-f88813948e.jpg"></figure>
      <div class="mat-t"><p class="eyebrow">Основа всего, что мы делаем</p><h2>Берёзовая фанера</h2><p>Корпуса, фасады и столешницы делаем из берёзовой фанеры 15 мм. Это 11 слоёв лущёного берёзового шпона, склеенных крест-накрест: волокна каждого слоя идут поперёк соседнего, поэтому лист не ведёт и держит винт даже у самой кромки.</p><p>Кромку не прячем под пластиком. Полосатый срез — это и есть фанера, мы шлифуем его и покрываем вместе с фасадом. Берём 15 мм, а не привычные 18: тонкая кромка выглядит легче и аккуратнее, а прочности для кухонных модулей хватает.</p><dl class="mat-f"><div><dt>Толщина</dt><dd>15 мм, 11 слоёв</dd></div><div><dt>Корпуса и фасады</dt><dd>фанера ФК, сорт 2/2, шлифованная</dd></div><div><dt>Столешницы</dt><dd>влагостойкая фанера ФСФ</dd></div></dl></div>
    </article>
    <article class="mat-row flip" id="mat-lino">
      <figure><img class="mat-img lino" alt="Стопка фанерных панелей с мебельным линолеумом: светлый, голубой, мятный, персиковый и зелёный, видны слои фанеры на срезе" loading="lazy" src="assets/mat-lino-f6c1c9d155.jpg"></figure>
      <div class="mat-t"><p class="eyebrow">Тёплая матовая поверхность</p><h2>Мебельный линолеум</h2><p>Натуральный мебельный линолеум Forbo делают из льняного масла, древесной муки, канифоли и известняка на джутовой основе. Он матовый, тёплый и мягкий на ощупь, на нём почти не видно отпечатков.</p><p>Клеим линолеум на фанеру и оставляем срез открытым: сверху цвет, на кромке — слои берёзы. Подходит и для фасадов, и для столешницы.</p><dl class="mat-f"><div><dt>Толщина</dt><dd>2 мм на фанере 15 мм</dd></div><div><dt>Цвета</dt><dd>16 оттенков, сверяем по образцам</dd></div><div><dt>Уход</dt><dd>влажная ткань, без абразивов</dd></div></dl></div>
    </article>
    <article class="mat-row" id="mat-paint">
      <figure><img class="mat-img paint" alt="Фанерные фасады, окрашенные в голубой, коралловый и светло-серый, стоят у стены; круглые вырезы-ручки и открытая берёзовая кромка" loading="lazy" src="assets/mat-paint-3b665d748c.jpg"></figure>
      <div class="mat-t"><p class="eyebrow">Цвет по каталогу RAL</p><h2>Краски</h2><p>Фасады красим в мастерской эмалью. В конструкторе — одиннадцать цветов нашей палитры, но покрасить можем в любой цвет из полного каталога RAL: просто назовите код. Цвет привязан к коду, поэтому его можно повторить и через годы.</p><p>Если сомневаетесь с выбором, мы всегда рады помочь: подскажем оттенок под стены, пол и свет вашей кухни.</p><p>Кромка фанеры остаётся открытой. Тонкая берёзовая полоска по краю — то, по чему нашу кухню узнают.</p><dl class="mat-f"><div><dt>Палитра</dt><dd>11 цветов в конструкторе и любой цвет RAL</dd></div><div><dt>Кромка</dt><dd>открытая, под прозрачным лаком</dd></div><div><dt>Внутри корпусов</dt><dd>берёза или любой цвет палитры</dd></div></dl></div>
    </article>
    <article class="mat-row flip" id="mat-oil">
      <figure><img class="mat-img oil" alt="Две панели берёзовой фанеры встык: слева без покрытия, справа под льняным маслом — тон теплее и глубже, рисунок ярче" loading="lazy" src="assets/mat-oil-9f9416c582.jpg"></figure>
      <div class="mat-t"><p class="eyebrow">Для тех, кто любит дерево</p><h2>Льняное масло с воском</h2><p>Покрытие на основе льняного масла с воском впитывается в волокна и проявляет рисунок берёзы. Поверхность остаётся деревом на ощупь: тёплой, матовой, без плёнки.</p><p>Масло легко обновить своими руками. Царапину можно зашкурить и подмаслить только в этом месте, без перекраски всего фасада.</p><dl class="mat-f"><div><dt>Вид</dt><dd>натуральная берёза, матовая</dd></div><div><dt>Обновление</dt><dd>раз в год-два на рабочих поверхностях</dd></div><div><dt>Ремонт</dt><dd>местный, своими руками</dd></div></dl></div>
    </article>
    <article class="mat-row" id="mat-korushka">
      <figure><img class="mat-img korushka" alt="Дубовые ручки «Корюшка» с профилем рыбьего хвоста лежат рядами на берёзовой фанере, виден торец ручки и слои фанеры" loading="lazy" src="assets/mat-korushka-b5858b4d43.jpg"></figure>
      <div class="mat-t"><p class="eyebrow">Наша фирменная ручка</p><h2>Ручка «Корюшка»</h2><p>Дубовая рейка во всю высоту дверцы, профиль которой повторяет хвост корюшки. Пальцы сами ложатся в выемку, а на фасаде нет ни одной металлической детали.</p><p>Фрезеруем рейки сами из массива дуба и ставим у левой кромки каждой дверцы, поэтому по всей кухне идёт один ровный ритм.</p><dl class="mat-f"><div><dt>Сечение</dt><dd>34 × 26 мм</dd></div><div><dt>Материал</dt><dd>массив дуба под маслом</dd></div><div><dt>Где</dt><dd>во всю высоту каждой дверцы</dd></div></dl></div>
    </article>
    <article class="mat-row flip" id="mat-drawers">
      <figure><img class="mat-img drawers" alt="Выдвинутые ящики из массива дуба на «ласточкином хвосте» за оливковыми фасадами: органайзер с ножами и приборами, внутренний ящик с кухонными мелочами" loading="lazy" src="assets/mat-drawers-f86408a704.jpg"></figure>
      <div class="mat-t"><p class="eyebrow">Массив дуба, «ласточкин хвост»</p><h2>Ящики и органайзеры</h2><p>Короба ящиков всегда делаем из массива дуба и соединяем на «ласточкин хвост» — так же, как столяры собирали ящики сто лет назад. Соединение держится без шурупов и не расшатывается.</p><p>Внутрь делаем дубовые органайзеры по размеру короба: лотки для приборов, подставку для ножей, отделения для специй и мелочей. Вкладыши вынимаются, их можно переставить или помыть. В каждом ящике есть внутренний ящик, а направляющие Blum с доводчиком спрятаны под дном.</p><p>Расскажите на замере, что храните, и мы разложим ящики под вас.</p><dl class="mat-f"><div><dt>Короб</dt><dd>массив дуба 15 мм, натуральный или копчёный</dd></div><div><dt>Соединение</dt><dd>«ласточкин хвост»</dd></div><div><dt>Органайзеры</dt><dd>приборы, ножи, специи — по размеру ящика</dd></div><div><dt>Направляющие</dt><dd>Blum Tandem с доводчиком, скрытые</dd></div></dl></div>
    </article>
